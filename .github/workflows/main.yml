name: Build and Test

on:
  push:
    branches:
    - 'main'
    tags:
    - 'v*'
  pull_request:
    branches:
    - '*'
  workflow_dispatch:


jobs:
  macOS-framework:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: macos-framework-arm64
            runner: macos-latest
            arch: arm64
          - name: macos-framework-x86_64
            runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: 'x64'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v3
        id: cache
        with:
          path: ./build/${{ matrix.name }}/third_party/install
          key: ${{ github.job }}-${{ matrix.name }}-${{ hashFiles('./third_party/**') }}
      - name: disable superbuild on cache hit
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "superbuild=-DSUPERBUILD=OFF" >> $GITHUB_ENV && echo "cmake_prefix_path=-DCMAKE_PREFIX_PATH=$(pwd)/build/${{ matrix.name }}/third_party/install" >> $GITHUB_ENV
      - name: set SDKROOT value
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
      - name: install pymavlink dependencies
        run: python3 -m pip install future
      - name: configure
        run: cmake $superbuild $cmake_prefix_path -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=build/${{ matrix.name }}/install -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DBUILD_MAVSDK_SERVER=ON -DBUILD_SHARED_LIBS=OFF -DMACOS_FRAMEWORK=ON -DWERROR=OFF -Bbuild/${{ matrix.name }} -H.
      - name: build
        run: cmake --build build/${{ matrix.name }} -j2 --target install
      - uses: actions/upload-artifact@v6
        with:
          name: mavsdk_server_${{ matrix.name }}.framework
          path: ./build/${{ matrix.name }}/src/mavsdk_server/src/mavsdk_server.framework
          retention-days: 2

  iOS:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: ios-device
            runner: macos-latest
            platform: OS64
            sdk: iphoneos
            generate-dsym: 'true'
          - name: ios-simulator-arm64
            runner: macos-latest
            platform: SIMULATORARM64
            sdk: iphonesimulator
            generate-dsym: 'false'
          - name: ios-simulator-x86_64
            runner: macos-15-intel
            platform: SIMULATOR64
            sdk: iphonesimulator
            generate-dsym: 'false'
    steps:
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: 'x64'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v3
        id: cache
        with:
          path: ./build/${{ matrix.name }}/third_party/install
          key: ${{ github.job }}-${{ matrix.name }}-${{ hashFiles('./third_party/**', './tools/ios.toolchain.cmake') }}
      - name: disable superbuild on cache hit
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "superbuild=-DSUPERBUILD=OFF" >> $GITHUB_ENV && echo "cmake_prefix_path=-DCMAKE_PREFIX_PATH=$(pwd)/build/${{ matrix.name }}/third_party/install" >> $GITHUB_ENV
      - name: set SDK-related environment variables (for non-cmake deps)
        run: |
          echo "SDKROOT=$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)" >> $GITHUB_ENV
      - name: install pymavlink dependencies
        run: python3 -m pip install future
      - name: configure
        run: cmake $superbuild $cmake_prefix_path -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DENABLE_STRICT_TRY_COMPILE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE=$(pwd)/tools/ios.toolchain.cmake -DPLATFORM=${{ matrix.platform }} -DDEPLOYMENT_TARGET=13.0 -DBUILD_MAVSDK_SERVER=ON -DBUILD_SHARED_LIBS=OFF -DWERROR=OFF -Bbuild/${{ matrix.name }} -H.
      - name: build
        run: cmake --build build/${{ matrix.name }} -j2
      - name: generate dSYM
        if: ${{ matrix.generate-dsym == 'true' }}
        run: dsymutil build/${{ matrix.name }}/src/mavsdk_server/src/mavsdk_server.framework/mavsdk_server -o build/${{ matrix.name }}/src/mavsdk_server/src/mavsdk_server.framework.dSYM
      - uses: actions/upload-artifact@v6
        with:
          name: mavsdk_server_${{ matrix.name }}.framework
          path: ./build/${{ matrix.name }}/src/mavsdk_server/src/mavsdk_server.framework
          retention-days: 2
      - uses: actions/upload-artifact@v6
        if: ${{ matrix.generate-dsym == 'true' }}
        with:
          name: mavsdk_server_${{ matrix.name }}.framework.dSYM
          path: ./build/${{ matrix.name }}/src/mavsdk_server/src/mavsdk_server.framework.dSYM
          retention-days: 2

  iOS-XCFramework:
    name: iOS XCFramework
    needs: [macOS-framework, iOS]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v7
        with:
          name: mavsdk_server_ios-device.framework
          path: ./build/ios-device/src/mavsdk_server/src/mavsdk_server.framework
      - uses: actions/download-artifact@v7
        with:
          name: mavsdk_server_ios-device.framework.dSYM
          path: ./build/ios-device/src/mavsdk_server/src/mavsdk_server.framework.dSYM
      - uses: actions/download-artifact@v7
        with:
          name: mavsdk_server_ios-simulator-arm64.framework
          path: ./build/ios-simulator-arm64/src/mavsdk_server/src/mavsdk_server.framework
      - uses: actions/download-artifact@v7
        with:
          name: mavsdk_server_ios-simulator-x86_64.framework
          path: ./build/ios-simulator-x86_64/src/mavsdk_server/src/mavsdk_server.framework
      - uses: actions/download-artifact@v7
        with:
          name: mavsdk_server_macos-framework-arm64.framework
          path: ./build/macos-framework-arm64/src/mavsdk_server/src/mavsdk_server.framework
      - uses: actions/download-artifact@v7
        with:
          name: mavsdk_server_macos-framework-x86_64.framework
          path: ./build/macos-framework-x86_64/src/mavsdk_server/src/mavsdk_server.framework
      - name: Package
        run: bash ./src/mavsdk_server/tools/package_mavsdk_server_framework.bash
      - name: Verify SwiftPM zip layout
        run: zipinfo -1 ./build/mavsdk_server.xcframework.zip | grep -q '^mavsdk_server.xcframework/Info.plist$'
      - uses: actions/upload-artifact@v6
        with:
          name: mavsdk_server.xcframework.zip
          path: ./build/mavsdk_server.xcframework.zip
          retention-days: 2
      - uses: actions/upload-artifact@v6
        with:
          name: mavsdk_server.xcframework.zip.sha256
          path: ./build/mavsdk_server.xcframework.zip.sha256
          retention-days: 2
      - name: Publish xcframework
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'build/mavsdk_server.xcframework.zip'
          asset_name: 'mavsdk_server.xcframework.zip'
          tag: ${{ github.ref }}
          overwrite: true
      - name: Publish xcframework checksum
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'build/mavsdk_server.xcframework.zip.sha256'
          asset_name: 'mavsdk_server.xcframework.zip.sha256'
          tag: ${{ github.ref }}
          overwrite: true
